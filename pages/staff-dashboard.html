<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Staff Dashboard</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="phone-container">
    <div class="phone-screen">
      <header>
        <h1>PAWN OF THE DEAD</h1>
        <p>Staff Dashboard</p>
        <nav>
          <button class="nav-btn active" data-page="inventory" onclick="switchPage('inventory', this)">Inventory</button>
          <button class="nav-btn" data-page="add" onclick="switchPage('add', this)">Add Item</button>
          <button class="nav-btn" data-page="edit" onclick="switchPage('edit', this)">Edit</button>
          <button class="nav-btn" data-page="logout" onclick="doLogout()">Logout</button>
        </nav>
      </header>

      <!-- INVENTORY PAGE -->
      <main id="inventory" class="active">
        <h2 style="color: var(--accent-orange); font-size: 0.9rem; margin: 10px 0; text-transform: uppercase;">Current Stock</h2>
        <div id="inventoryList">
          <p style="color: var(--primary-text); text-align: center;">Loading inventory...</p>
        </div>
      </main>

      <!-- ADD ITEM PAGE -->
      <main id="add">
        <h2 style="color: var(--accent-orange); font-size: 0.9rem; margin: 10px 0; text-transform: uppercase;">Register New Item</h2>
        <form onsubmit="addItem(event)">
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="itemName" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="itemDesc" required></textarea>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="itemCategory" required>
              <option value="">Select Category</option>
              <option value="weapons">Weapons</option>
              <option value="jewelry">Jewelry</option>
              <option value="electronics">Electronics</option>
              <option value="furniture">Furniture</option>
              <option value="antiques">Antiques</option>
              <option value="cursed">Cursed Items</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" id="itemPrice" step="0.01" required />
          </div>
          <div class="form-group">
            <label>Condition</label>
            <select id="itemCondition" required>
              <option value="mint">Mint</option>
              <option value="excellent">Excellent</option>
              <option value="good">Good</option>
              <option value="fair">Fair</option>
              <option value="poor">Poor</option>
            </select>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="itemVisible" checked /> Visible to Public
            </label>
          </div>
          <button type="submit" class="btn-primary">Register Item</button>
        </form>
        <p id="addMessage" style="margin-top: 10px;"></p>
      </main>

      <!-- EDIT PAGE -->
      <main id="edit">
        <h2 style="color: var(--accent-orange); font-size: 0.9rem; margin: 10px 0; text-transform: uppercase;">Edit Item</h2>
        <div id="editList">
          <p style="color: var(--primary-text); text-align: center;">Loading items...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
      authDomain: "pawn-of-the-dead.firebaseapp.com",
      projectId: "pawn-of-the-dead",
      storageBucket: "pawn-of-the-dead.firebasestorage.app",
      messagingSenderId: "247522640326",
      appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
    };

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    function checkAuth() {
      const user = sessionStorage.getItem("potd_user");
      if (!user) {
        window.location.href = "../index.html";
      }
    }

    function doLogout() {
      sessionStorage.clear();
      window.location.href = "../index.html";
    }

    function switchPage(page, btn) {
      document.querySelectorAll("main").forEach(m => m.classList.remove("active"));
      document.getElementById(page).classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (page === "inventory") loadInventory();
      if (page === "edit") loadEditList();
    }

    async function loadInventory() {
      try {
        const snapshot = await db.collection("items").get();
        const container = document.getElementById("inventoryList");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = "<p style='color: var(--primary-text); text-align: center;'>No items in inventory.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          const visibility = item.visible ? "✓ Visible" : "✗ Hidden";
          const html = `
            <div class="item-card">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p><strong>Price:</strong> $${item.price}</p>
              <p><strong>Condition:</strong> ${item.condition}</p>
              <p style="font-size: 0.75rem; color: var(--primary-text);">${visibility}</p>
            </div>
          `;
          container.innerHTML += html;
        });
      } catch(e) {
        console.error("Error:", e);
      }
    }

    async function addItem(e) {
      e.preventDefault();
      const msgDiv = document.getElementById("addMessage");
      msgDiv.innerHTML = "";

      try {
        const newItem = {
          name: document.getElementById("itemName").value,
          description: document.getElementById("itemDesc").value,
          category: document.getElementById("itemCategory").value,
          price: parseFloat(document.getElementById("itemPrice").value),
          condition: document.getElementById("itemCondition").value,
          visible: document.getElementById("itemVisible").checked,
          createdAt: new Date().toISOString()
        };

        await db.collection("items").add(newItem);
        msgDiv.innerHTML = "<p class='message success'>✓ Item registered successfully!</p>";
        e.target.reset();
        setTimeout(() => msgDiv.innerHTML = "", 3000);
      } catch(e) {
        msgDiv.innerHTML = "<p class='message error'>✗ Error: " + e.message + "</p>";
      }
    }

    async function loadEditList() {
      try {
        const snapshot = await db.collection("items").get();
        const container = document.getElementById("editList");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = "<p style='color: var(--primary-text); text-align: center;'>No items to edit.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          const html = `
            <div class="item-card">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p><strong>Price:</strong> $${item.price}</p>
              <button class="btn-edit btn-small" onclick="editItem('${doc.id}')">Edit</button>
              <button class="btn-danger btn-small" onclick="deleteItem('${doc.id}')">Delete</button>
            </div>
          `;
          container.innerHTML += html;
        });
      } catch(e) {
        console.error("Error:", e);
      }
    }

    async function deleteItem(docId) {
      if (confirm("Delete this item?")) {
        try {
          await db.collection("items").doc(docId).delete();
          loadEditList();
        } catch(e) {
          alert("Error: " + e.message);
        }
      }
    }

    function editItem(docId) {
      alert("Edit functionality - customize as needed. Item ID: " + docId);
    }

    checkAuth();
    loadInventory();
  </script>
</body>
</html>
