<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLOODLINE — Crew</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="scanlines"></div>
<div class="noise"></div>

<div class="app-shell">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-brand">🩸 BLOODLINE</div>
    <div class="topbar-badge" style="background:var(--gold-dim)">CREW</div>
    <div class="topbar-right">
      <div class="topbar-user">OPERATIVE: <span id="displayUser">—</span></div>
      <button class="btn-logout" onclick="logout()">LOGOUT</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="nav-section">INTEL</div>
    <button class="nav-item active" onclick="showSection('my-cuts')">
      <span class="nav-icon">💰</span> My Cuts
    </button>
    <button class="nav-item" onclick="showSection('calendar')">
      <span class="nav-icon">📅</span> Calendar
    </button>
    <button class="nav-item" onclick="showSection('recipes')">
      <span class="nav-icon">🧪</span> Recipes
    </button>
    <button class="nav-item" onclick="window.location.href='constitution.html'">
      <span class="nav-icon">📜</span> Constitution
    </button>

    <div class="nav-section">OPERATIONS</div>
    <button class="nav-item" onclick="showSection('my-jobs')">
      <span class="nav-icon">📋</span> My Jobs
    </button>
  </nav>

  <!-- MAIN -->
  <main class="main-content">

    <!-- MY CUTS -->
    <section class="page-section active" id="sec-my-cuts">
      <div class="page-header">
        <h1 class="page-title">MY CUTS</h1>
        <span class="page-sub" id="crewSubtitle">YOUR EARNINGS</span>
      </div>

      <div class="grid-3" style="margin-bottom:1.5rem">
        <div class="stat-card">
          <div class="stat-label">TOTAL JOBS</div>
          <div class="stat-value" id="myStatJobs">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">TOTAL EARNED</div>
          <div class="stat-value green" id="myStatTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">THIS MONTH</div>
          <div class="stat-value gold" id="myStatMonth">—</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">💸 EARNINGS BREAKDOWN</div>
        <div id="myCutsBreakdown"></div>
      </div>
    </section>

    <!-- CALENDAR (read-only) -->
    <section class="page-section" id="sec-calendar">
      <div class="page-header">
        <h1 class="page-title">CALENDAR</h1>
        <span class="page-sub">EVENTS & MEETINGS</span>
      </div>
      <div class="panel">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calPrev()">‹</button>
          <div class="cal-nav-title" id="calTitle">—</div>
          <button class="cal-nav-btn" onclick="calNext()">›</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
      </div>
      <div class="panel" style="margin-top:1rem">
        <div class="panel-title">🗓 UPCOMING</div>
        <div id="upcomingList"></div>
      </div>
    </section>

    <!-- RECIPES (read-only) -->
    <section class="page-section" id="sec-recipes">
      <div class="page-header">
        <h1 class="page-title">RECIPES</h1>
        <span class="page-sub">CRAFTING CATALOGUE</span>
      </div>
      <div class="recipe-grid" id="recipeGrid"></div>
    </section>

    <!-- MY JOBS -->
    <section class="page-section" id="sec-my-jobs">
      <div class="page-header">
        <h1 class="page-title">MY JOBS</h1>
        <span class="page-sub">OPERATIONS YOU WERE ON</span>
      </div>
      <div class="panel">
        <div style="display:flex;gap:1rem;margin-bottom:1rem">
          <div class="form-group">
            <label class="form-label">FILTER BY MONTH</label>
            <input class="form-control" type="month" id="myJobMonth"/>
          </div>
          <button class="btn btn-ghost" style="margin-top:auto" onclick="loadMyJobs()">FILTER</button>
        </div>
        <table class="data-table">
          <thead><tr>
            <th>DATE</th><th>TYPE</th><th>LOCATION</th><th>STATUS</th><th>YOUR CUT</th>
          </tr></thead>
          <tbody id="myJobsBody"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
    // ============================================================
    // PASTE YOUR FIREBASE CONFIG HERE (same as index.html)
    // ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
  authDomain: "pawn-of-the-dead.firebaseapp.com",
  projectId: "pawn-of-the-dead",
  storageBucket: "pawn-of-the-dead.firebasestorage.app",
  messagingSenderId: "247522640326",
  appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
};
    // ============================================================

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    const collection = (d, c) => d.collection(c);
    const query      = (ref, ...constraints) => { let q = ref; constraints.forEach(c => { q = c(q); }); return q; };
    const orderBy    = (field, dir="asc") => (ref) => ref.orderBy(field, dir);
    const _getDocs   = async (ref) => { const snap = await ref.get(); return { docs: snap.docs, empty: snap.empty }; };

// ── Auth guard ──
const role    = sessionStorage.getItem("bl_role");
const user    = sessionStorage.getItem("bl_user");
const display = sessionStorage.getItem("bl_display");
if (role !== "crew") { window.location.href = "../index.html"; }
document.getElementById("displayUser").textContent = (display||user||"UNKNOWN").toUpperCase();
document.getElementById("crewSubtitle").textContent = (display||user||"CREW").toUpperCase() + "'S EARNINGS";

window.logout = () => { sessionStorage.clear(); window.location.href = "../index.html"; };

// ── Navigation ──
window.showSection = function(id) {
  document.querySelectorAll(".page-section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  event.currentTarget.classList.add("active");
  if (id==="calendar")  renderCalendar();
  if (id==="recipes")   loadRecipes();
  if (id==="my-jobs")   loadMyJobs();
};

// ══════════════════════════════════════════════
// MY CUTS
// ══════════════════════════════════════════════
async function loadMyCuts() {
  const snap = await _getDocs(query(db.collection("jobs"),orderBy("date","desc")));
  const allJobs = snap.docs.map(d=>({id:d.id,...d.data()}));
  const myJobs  = allJobs.filter(j=>(j.crew||[]).map(c=>c.toLowerCase()).includes(user));

  const now   = new Date();
  const month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisMonthJobs = myJobs.filter(j=>j.date&&j.date.startsWith(month));

  const total      = myJobs.reduce((s,j)=>s+(j.perHead||0),0);
  const monthTotal = thisMonthJobs.reduce((s,j)=>s+(j.perHead||0),0);

  document.getElementById("myStatJobs").textContent  = myJobs.length;
  document.getElementById("myStatTotal").textContent = "£"+total.toLocaleString();
  document.getElementById("myStatMonth").textContent = "£"+monthTotal.toLocaleString();

  const breakdown = document.getElementById("myCutsBreakdown");
  if (myJobs.length===0) {
    breakdown.innerHTML=`<p style="color:var(--text-dim);font-family:var(--font-mono)">You haven't been on any jobs yet.</p>`;
    return;
  }

  breakdown.innerHTML = myJobs.map(j=>`
    <div style="display:flex;align-items:center;gap:1rem;padding:0.7rem 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <span class="mono" style="color:var(--text-dim);min-width:100px">${j.date}</span>
      <span style="font-weight:700;flex:1">${j.type}</span>
      <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-dim)">${j.location||""}</span>
      <span class="badge ${j.status==='success'?'green':j.status==='partial'?'gold':''}">${(j.status||"?").toUpperCase()}</span>
      <span style="font-family:var(--font-mono);color:var(--green);font-size:1rem;min-width:80px;text-align:right">£${(j.perHead||0).toLocaleString()}</span>
    </div>`).join("");
}
loadMyCuts();

// ══════════════════════════════════════════════
// MY JOBS TABLE
// ══════════════════════════════════════════════
window.loadMyJobs = async function() {
  const snap = await _getDocs(query(db.collection("jobs"),orderBy("date","desc")));
  let jobs = snap.docs.map(d=>({id:d.id,...d.data()}))
    .filter(j=>(j.crew||[]).map(c=>c.toLowerCase()).includes(user));

  const mf = document.getElementById("myJobMonth").value;
  if (mf) jobs = jobs.filter(j=>j.date&&j.date.startsWith(mf));

  const tbody = document.getElementById("myJobsBody");
  if (jobs.length===0) {
    tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;color:var(--text-dim);font-family:var(--font-mono);padding:2rem">No jobs found.</td></tr>`;
    return;
  }
  tbody.innerHTML = jobs.map(j=>`<tr>
    <td class="mono">${j.date}</td>
    <td>${j.type}</td>
    <td>${j.location||"—"}</td>
    <td><span class="badge ${j.status==='success'?'green':j.status==='partial'?'gold':''}">${(j.status||"?").toUpperCase()}</span></td>
    <td class="mono" style="color:var(--green)">£${(j.perHead||0).toLocaleString()}</td>
  </tr>`).join("");
};

// ══════════════════════════════════════════════
// CALENDAR (read-only)
// ══════════════════════════════════════════════
let calDate = new Date(), calEvents = [];

async function fetchEvents() {
  const snap = await _getDocs(db.collection("events"));
  calEvents = snap.docs.map(d=>({id:d.id,...d.data()}));
}

window.renderCalendar = async function() {
  await fetchEvents();
  const y=calDate.getFullYear(), m=calDate.getMonth();
  document.getElementById("calTitle").textContent =
    calDate.toLocaleString("en-GB",{month:"long",year:"numeric"}).toUpperCase();

  const grid  = document.getElementById("calGrid");
  const days  = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
  let html    = days.map(d=>`<div class="cal-header">${d}</div>`).join("");

  const first    = new Date(y,m,1);
  let startDay   = first.getDay()-1; if(startDay<0) startDay=6;
  const inMonth  = new Date(y,m+1,0).getDate();
  const today    = new Date().toISOString().slice(0,10);

  for(let i=0;i<startDay;i++){
    const d=new Date(y,m,-startDay+i+1).getDate();
    html+=`<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }
  for(let d=1;d<=inMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===today;
    const dayEv=calEvents.filter(e=>e.date===ds);
    html+=`<div class="cal-day${isToday?' today':''}">
      <div class="cal-day-num">${d}</div>
      ${dayEv.map(e=>`<div class="cal-event${e.type==='meeting'?' meeting':''}">${e.title}</div>`).join("")}
    </div>`;
  }
  grid.innerHTML=html;

  // Upcoming
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = calEvents.filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  const upDiv    = document.getElementById("upcomingList");
  if(!upcoming.length){
    upDiv.innerHTML=`<p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.8rem">Nothing scheduled.</p>`;
  } else {
    upDiv.innerHTML = upcoming.map(e=>`
      <div style="display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid var(--border)">
        <span class="badge ${e.type==='meeting'?'gold':''}">${e.type==='meeting'?'MEETING':'EVENT'}</span>
        <span style="font-weight:700">${e.title}</span>
        ${e.notes?`<span style="color:var(--text-dim);font-size:0.8rem;font-family:var(--font-body)">${e.notes}</span>`:''}
        <span style="margin-left:auto;font-family:var(--font-mono);font-size:0.75rem;color:var(--text-dim)">${e.date}</span>
      </div>`).join("");
  }
};

window.calPrev = ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); };
window.calNext = ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); };

// ══════════════════════════════════════════════
// RECIPES (read-only)
// ══════════════════════════════════════════════
window.loadRecipes = async function() {
  const snap = await _getDocs(db.collection("recipes"));
  const grid = document.getElementById("recipeGrid");
  if(snap.empty){ grid.innerHTML=`<p style="color:var(--text-dim);font-family:var(--font-mono)">No recipes in the system yet.</p>`; return; }
  grid.innerHTML = snap.docs.map(d=>{
    const r=d.data();
    const ings=(r.ingredients||"").split("\n").filter(Boolean);
    return `<div class="recipe-card">
      <div class="recipe-card-tag ${r.category==='weapon'?'weapon':''}">${r.category?.toUpperCase()||"ITEM"}</div>
      <div class="recipe-card-name">${r.name}</div>
      <ul class="recipe-ingredients">${ings.map(i=>`<li>${i}</li>`).join("")}</ul>
      <div class="recipe-yield">YIELD: ${r.yield||"?"} &nbsp;|&nbsp; VALUE: £${(+r.value||0).toLocaleString()}</div>
    </div>`;
  }).join("");
};
</script>
</body>
</html>
