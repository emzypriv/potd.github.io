<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Browse</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="phone-container">
    <div class="phone-screen">
      <header>
        <h1>PAWN OF THE DEAD</h1>
        <p>Browse Our Cursed Inventory</p>
      </header>

      <main class="active">
        <div class="stat-box">
          <div class="label">Welcome to the Crypt</div>
          <div class="value">☠️</div>
        </div>

        <h2 style="color: var(--primary-text); font-size: 0.9rem; margin: 15px 0 10px; text-transform: uppercase;">Featured Items</h2>

        <div id="itemsContainer">
          <p style="color: var(--light-text); text-align: center; padding: 20px;">Loading inventory...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // DECLARE GLOBALLY FIRST
    let db = null;
    let firebaseReady = false;

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
      authDomain: "pawn-of-the-dead.firebaseapp.com",
      projectId: "pawn-of-the-dead",
      storageBucket: "pawn-of-the-dead.firebasestorage.app",
      messagingSenderId: "247522640326",
      appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
    };

    function initFirebase() {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        firebaseReady = true;
        loadInventory();
      } catch(e) {
        console.error("Firebase error:", e);
        document.getElementById("itemsContainer").innerHTML = "<p style='color: red;'>Firebase config error</p>";
      }
    }

    async function loadInventory() {
      if (!firebaseReady || !db) {
        document.getElementById("itemsContainer").innerHTML = "<p style='color: red;'>System initializing...</p>";
        return;
      }

      try {
        const snapshot = await db.collection("items").where("visible", "==", true).get();
        const container = document.getElementById("itemsContainer");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = "<p style='color: var(--light-text); text-align: center;'>Inventory depleted...</p>";
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          const html = `
            <div class="item-card">
              <h3>${item.name || 'Unknown Item'}</h3>
              <p>${item.description || 'No description'}</p>
              <p><strong>Category:</strong> ${item.category || 'N/A'}</p>
              <div class="price">$${item.price || '0.00'}</div>
              <span class="condition ${item.condition || 'poor'}">${(item.condition || 'poor').toUpperCase()}</span>
            </div>
          `;
          container.innerHTML += html;
        });
      } catch(e) {
        console.error("Error:", e);
        document.getElementById("itemsContainer").innerHTML = "<p style='color: red;'>Error: " + e.message + "</p>";
      }
    }

    initFirebase();
  </script>
</body>
</html>
