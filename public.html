<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Browse</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="phone-container">
    <div class="phone-screen">

      <header>
        <div class="logo-section">
          <div class="logo">☠️</div>
          <h1>PAWN OF THE DEAD</h1>
        </div>
        <p>Browse Our Cursed Inventory</p>

        <div class="sort-controls">
          <div class="search-bar" style="margin-bottom:6px;">
            <input type="text" id="searchInput" placeholder="Search items..." oninput="applyFilters()"/>
          </div>
          <div class="filter-row">
            <select id="filterCat" onchange="applyFilters()">
              <option value="">All Categories</option>
            </select>
            <select id="sortBy" onchange="applyFilters()">
              <option value="name">Name A–Z</option>
              <option value="price-low">Price ↑</option>
              <option value="price-high">Price ↓</option>
              <option value="condition">Condition</option>
            </select>
          </div>
        </div>
      </header>

      <main class="active">
        <div id="itemsContainer">
          <div class="empty-state"><span class="empty-icon">💀</span>Loading inventory...</div>
        </div>
      </main>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const FB_CONFIG = {
      apiKey:            "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
      authDomain:        "pawn-of-the-dead.firebaseapp.com",
      projectId:         "pawn-of-the-dead",
      storageBucket:     "pawn-of-the-dead.firebasestorage.app",
      messagingSenderId: "247522640326",
      appId:             "1:247522640326:web:afdd7403d4294e21acf2c7"
    };

    let db = null;
    let allItems = [];

    function initFirebase() {
      try {
        if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(FB_CONFIG);
        db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true, merge: true });
        loadItems();
      } catch (e) {
        document.getElementById("itemsContainer").innerHTML =
          `<div class="message error">Firebase error: ${e.message}</div>`;
      }
    }

    async function loadItems() {
      try {
        const snap = await db.collection("items").where("visible", "==", true).get();
        allItems = [];
        const cats = new Set();

        snap.forEach(doc => {
          const d = { id: doc.id, ...doc.data() };
          allItems.push(d);
          if (d.category) cats.add(d.category);
        });

        // Populate category filter
        const catSel = document.getElementById("filterCat");
        [...cats].sort().forEach(c => {
          const o = document.createElement("option");
          o.value = c; o.textContent = c.charAt(0).toUpperCase() + c.slice(1);
          catSel.appendChild(o);
        });

        applyFilters();
      } catch (e) {
        document.getElementById("itemsContainer").innerHTML =
          `<div class="message error">${e.message}</div>`;
      }
    }

    function applyFilters() {
      const q      = (document.getElementById("searchInput").value || "").toLowerCase();
      const cat    = document.getElementById("filterCat").value;
      const sortBy = document.getElementById("sortBy").value;

      let filtered = allItems.filter(item => {
        const matchQ   = !q || (item.name || "").toLowerCase().includes(q) || (item.category || "").toLowerCase().includes(q);
        const matchCat = !cat || item.category === cat;
        return matchQ && matchCat;
      });

      const condOrder = { mint:1, excellent:2, good:3, fair:4, poor:5 };
      if      (sortBy === "price-low")  filtered.sort((a,b) => (a.price||0) - (b.price||0));
      else if (sortBy === "price-high") filtered.sort((a,b) => (b.price||0) - (a.price||0));
      else if (sortBy === "condition")  filtered.sort((a,b) => (condOrder[a.condition]||99) - (condOrder[b.condition]||99));
      else                              filtered.sort((a,b) => (a.name||"").localeCompare(b.name||""));

      renderItems(filtered);
    }

    function renderItems(items) {
      const container = document.getElementById("itemsContainer");

      if (!items.length) {
        container.innerHTML = `<div class="empty-state"><span class="empty-icon">☠️</span>No items found.</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-header">
            <h3>${escHtml(item.name)}</h3>
            <span class="condition ${item.condition || ''}">${(item.condition || 'UNKNOWN').toUpperCase()}</span>
          </div>
          <div class="item-meta">
            <span class="item-category">${item.category ? item.category.toUpperCase() : 'N/A'}</span>
          </div>
          <div class="item-price">$${(item.price || 0).toFixed(2)}</div>
        </div>
      `).join("");
    }

    function escHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    window.addEventListener("load", initFirebase);
  </script>
</body>
</html>
