<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Browse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="phone-container">
    <div class="phone-screen">
      <header>
        <div class="logo-section">
          <div class="logo">☠️</div>
          <h1>PAWN OF THE DEAD</h1>
        </div>
        <p>Browse Our Cursed Inventory</p>
        
        <div class="sort-controls">
          <select id="sortBy" onchange="applySort()" style="width: 100%; padding: 6px; background: #1a1a1a; color: var(--primary-text); border: 1px solid var(--border-color); font-size: 0.75rem;">
            <option value="name">Sort by Name</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="category">Sort by Category</option>
            <option value="condition">Sort by Condition</option>
          </select>
        </div>
      </header>

      <main class="active">
        <div id="itemsContainer">
          <p style="color: var(--light-text); text-align: center; padding: 20px;">Loading inventory...</p>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    let db = null;
    let allItems = [];

    function initFirebase() {
      const config = {
        apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
        authDomain: "pawn-of-the-dead.firebaseapp.com",
        projectId: "pawn-of-the-dead",
        storageBucket: "pawn-of-the-dead.firebasestorage.app",
        messagingSenderId: "247522640326",
        appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
      };

      try {
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(config);
        }
        db = firebase.firestore();
        loadItems();
      } catch(e) {
        console.error(e);
        document.getElementById("itemsContainer").innerHTML = "<p style='color: red;'>Firebase error: " + e.message + "</p>";
      }
    }

    async function loadItems() {
      try {
        const snap = await db.collection("items").where("visible", "==", true).get();
        allItems = [];
        
        snap.forEach(doc => {
          allItems.push({ id: doc.id, ...doc.data() });
        });
        
        applySort();
      } catch(e) {
        console.error(e);
        document.getElementById("itemsContainer").innerHTML = "<p style='color: red;'>" + e.message + "</p>";
      }
    }

    function applySort() {
      const sortBy = document.getElementById("sortBy").value;
      let sorted = [...allItems];

      if (sortBy === "price-low") {
        sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (sortBy === "price-high") {
        sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
      } else if (sortBy === "category") {
        sorted.sort((a, b) => (a.category || "").localeCompare(b.category || ""));
      } else if (sortBy === "condition") {
        const condOrder = { mint: 1, excellent: 2, good: 3, fair: 4, poor: 5 };
        sorted.sort((a, b) => (condOrder[a.condition] || 99) - (condOrder[b.condition] || 99));
      } else {
        sorted.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      }

      renderItems(sorted);
    }

    function renderItems(items) {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = "<p style='color: var(--light-text); text-align: center; padding: 20px;'>Inventory depleted...</p>";
        return;
      }

      items.forEach(item => {
        container.innerHTML += `
          <div class="item-card">
            <div class="item-header">
              <h3>${item.name}</h3>
              <span class="condition ${item.condition}">${(item.condition || "UNKNOWN").toUpperCase()}</span>
            </div>
            <p class="item-category"><strong>${item.category ? item.category.toUpperCase() : "N/A"}</strong></p>
            <div class="item-price">$${(item.price || 0).toFixed(2)}</div>
          </div>
        `;
      });
    }

    window.addEventListener("load", initFirebase);
  </script>
</body>
</html>
