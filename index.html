<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Access</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">
  <div class="phone-container">
    <div class="phone-screen">
      <div class="login-wrap">

        <div class="login-brand">
          <span class="brand-icon">☠️</span>
          <h1 class="brand-title">PAWN OF THE DEAD</h1>
          <p class="brand-sub">Undead Merchandise · Cursed Antiquities</p>
        </div>

        <div class="login-box">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

          <h2 class="login-heading">Staff Access</h2>

          <div class="field-group">
            <label class="field-label">Username</label>
            <input type="text" id="loginName" class="field-input" placeholder="enter your name" autocomplete="off"/>
          </div>

          <div class="field-group">
            <label class="field-label">Password</label>
            <input type="password" id="loginPass" class="field-input" placeholder="••••••••"/>
          </div>

          <button class="btn-primary" onclick="handleLogin()">Enter the Crypt</button>

          <p id="loginError" class="login-error"></p>
        </div>

        <p class="login-footer">PAWN OF THE DEAD © — We buy the dead, we sell the damned.</p>
      </div>
    </div>
  </div>

  <!-- Firebase compat (LB-Phone safe — no ES module imports) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ── Firebase config ──────────────────────────────────────
    const FB_CONFIG = {
      apiKey:            "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
      authDomain:        "pawn-of-the-dead.firebaseapp.com",
      projectId:         "pawn-of-the-dead",
      storageBucket:     "pawn-of-the-dead.firebasestorage.app",
      messagingSenderId: "247522640326",
      appId:             "1:247522640326:web:afdd7403d4294e21acf2c7"
    };

    let db = null;

    function initFirebase() {
      try {
        // Guard against duplicate initialisation (LB-Phone reloads)
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(FB_CONFIG);
        }
        db = firebase.firestore();

        // Disable long-polling / websockets that trip up FiveM's CEF
      } catch (e) {
        console.error("Firebase init error:", e);
      }
    }

    async function handleLogin() {
      const errEl = document.getElementById("loginError");
      errEl.textContent = "";

      if (!db) { errEl.textContent = "⚠ Firebase not ready — refresh."; return; }

      const user = document.getElementById("loginName").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value;

      if (!user || !pass) { errEl.textContent = "⚠ Fill in all fields."; return; }

      try {
        const doc = await db.collection("staff").doc(user).get();

        if (!doc.exists) { errEl.textContent = "⚠ Unknown operative."; return; }

        const data = doc.data();
        if (data.pin !== pass) { errEl.textContent = "⚠ Wrong code."; return; }

        sessionStorage.setItem("potd_user",    user);
        sessionStorage.setItem("potd_role",    data.role    || "staff");
        sessionStorage.setItem("potd_display", data.displayName || user);

        window.location.href = "staff-dashboard.html";
      } catch (e) {
        errEl.textContent = "⚠ " + e.message;
        console.error(e);
      }
    }

    window.addEventListener("load", initFirebase);
    document.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
  </script>
</body>
</html>
