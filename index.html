<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Access</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="phone-container">
    <div class="phone-screen">
      <div class="login-wrap">
        <div class="login-brand">
          <div class="brand-icon">☠️</div>
          <h1 class="brand-title">PAWN OF THE DEAD</h1>
          <p class="brand-sub">UNDEAD MERCHANDISE • CURSED ANTIQUITIES</p>
        </div>

        <div class="login-box">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

          <h2 class="login-heading">STAFF ACCESS</h2>

          <div class="field-group">
            <label class="field-label">USERNAME</label>
            <input type="text" id="loginName" class="field-input" placeholder="enter your name" autocomplete="off"/>
          </div>

          <div class="field-group">
            <label class="field-label">PASSWORD</label>
            <input type="password" id="loginPass" class="field-input" placeholder="••••••••"/>
          </div>

          <button class="btn-primary" onclick="handleLogin()">ENTER THE CRYPT</button>

          <p id="loginError" class="login-error"></p>
          <p id="debugLine" style="font-family:monospace;font-size:0.6rem;color:#666;text-align:center;margin-top:0.5rem;word-break:break-all;min-height:1rem;"></p>
        </div>

        <p class="login-footer">PAWN OF THE DEAD © — We buy the dead, we sell the damned.</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    let db = null;
    let fbReady = false;

    function initFirebase() {
      const config = {
        apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
        authDomain: "pawn-of-the-dead.firebaseapp.com",
        projectId: "pawn-of-the-dead",
        storageBucket: "pawn-of-the-dead.firebasestorage.app",
        messagingSenderId: "247522640326",
        appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
      };

      try {
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(config);
        }
        db = firebase.firestore();
        fbReady = true;
        debug("✓ Firebase ready");
      } catch(e) {
        debug("Firebase error: " + e.message);
        console.error(e);
      }
    }

    function debug(msg) {
      const el = document.getElementById("debugLine");
      if (el) el.textContent = msg;
    }

    async function handleLogin() {
      if (!fbReady || !db) {
        alert("Firebase not ready. Please refresh.");
        return;
      }

      const user = document.getElementById("loginName").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value;
      const errEl = document.getElementById("loginError");

      if (!user || !pass) {
        errEl.textContent = "⚠ Fill in all fields";
        return;
      }

      try {
        debug("Checking credentials...");
        const doc = await db.collection("staff").doc(user).get();

        if (!doc.exists) {
          errEl.textContent = "⚠ Unknown operative";
          return;
        }

        const data = doc.data();
        if (data.pin !== pass) {
          errEl.textContent = "⚠ Wrong code";
          return;
        }

        debug("Access granted");
        sessionStorage.setItem("potd_user", user);
        sessionStorage.setItem("potd_role", data.role || "staff");
        sessionStorage.setItem("potd_display", data.displayName || user);

        window.location.href = "staff-dashboard.html";
      } catch(e) {
        errEl.textContent = "⚠ " + e.message;
        console.error(e);
      }
    }

    window.addEventListener("load", initFirebase);
    document.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
  </script>
</body>
</html>
