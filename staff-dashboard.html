<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAWN OF THE DEAD — Staff Dashboard</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="phone-container">
    <div class="phone-screen">
      <header>
        <div class="logo-section">
          <div class="logo">☠️</div>
          <h1>PAWN OF THE DEAD</h1>
        </div>
        <p>Staff Dashboard</p>
        <nav>
          <button class="nav-btn active" onclick="switchPage('inventory', this)">Inventory</button>
          <button class="nav-btn" onclick="switchPage('add', this)">Add Item</button>
          <button class="nav-btn" onclick="switchPage('settings', this)">Settings</button>
          <button class="nav-btn" onclick="doLogout()">Logout</button>
        </nav>
      </header>

      <!-- INVENTORY -->
      <main id="inventory" class="active">
        <h2 style="color: var(--primary-text); font-size: 1.1rem; margin: 12px 0; text-transform: uppercase;">Current Stock</h2>
        <div id="inventoryList"><p style="color: var(--light-text);">Loading...</p></div>
      </main>

      <!-- ADD ITEM -->
      <main id="add">
        <h2 style="color: var(--primary-text); font-size: 1.1rem; margin: 12px 0; text-transform: uppercase;">Register Item</h2>
        <form onsubmit="addItem(event)">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="itemName" required />
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="itemCat" required>
              <option value="">Select Category</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" id="itemPrice" step="0.01" required />
          </div>
          <div class="form-group">
            <label>Condition</label>
            <select id="itemCond" required>
              <option value="">Select Condition</option>
            </select>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="itemVis" checked /> Visible to Public</label>
          </div>
          <button type="submit" class="btn-primary">Add Item</button>
        </form>
        <p id="addMsg" style="margin-top: 10px; font-size: 0.9rem;"></p>
      </main>

      <!-- SETTINGS -->
      <main id="settings">
        <h2 style="color: var(--primary-text); font-size: 1.1rem; margin: 12px 0; text-transform: uppercase;">Manage Options</h2>
        
        <div style="margin-bottom: 20px;">
          <h3 style="color: var(--primary-text); font-size: 0.95rem; margin: 10px 0 8px; text-transform: uppercase;">Categories</h3>
          <div id="categoriesList"></div>
          <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="newCategory" placeholder="New category" style="flex: 1; padding: 6px; background: #0f0f0f; border: 1px solid var(--border-color); color: var(--light-text); font-size: 0.85rem;"/>
            <button type="button" onclick="addCategory()" class="btn-secondary btn-small">Add</button>
          </div>
        </div>

        <div>
          <h3 style="color: var(--primary-text); font-size: 0.95rem; margin: 10px 0 8px; text-transform: uppercase;">Conditions</h3>
          <div id="conditionsList"></div>
          <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="newCondition" placeholder="New condition" style="flex: 1; padding: 6px; background: #0f0f0f; border: 1px solid var(--border-color); color: var(--light-text); font-size: 0.85rem;"/>
            <button type="button" onclick="addCondition()" class="btn-secondary btn-small">Add</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    let db = null;
    let categories = [];
    let conditions = [];

    function initFirebase() {
      const config = {
        apiKey: "AIzaSyBSCSW4pCsTtWJSsmh4n3gqpQkVZT9WVOU",
        authDomain: "pawn-of-the-dead.firebaseapp.com",
        projectId: "pawn-of-the-dead",
        storageBucket: "pawn-of-the-dead.firebasestorage.app",
        messagingSenderId: "247522640326",
        appId: "1:247522640326:web:afdd7403d4294e21acf2c7"
      };

      try {
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(config);
        }
        db = firebase.firestore();
        checkAuth();
      } catch(e) {
        console.error(e);
      }
    }

    function checkAuth() {
      const user = sessionStorage.getItem("potd_user");
      const role = sessionStorage.getItem("potd_role");
      if (!user || role !== "manager") {
        window.location.href = "index.html";
        return;
      }
      loadOptions();
      loadInventory();
    }

    async function loadOptions() {
      try {
        const doc = await db.collection("settings").doc("options").get();
        if (doc.exists) {
          const data = doc.data();
          categories = data.categories || [];
          conditions = data.conditions || [];
        } else {
          categories = ["weapons", "jewelry", "electronics", "furniture", "antiques", "cursed"];
          conditions = ["mint", "excellent", "good", "fair", "poor"];
        }
        updateDropdowns();
        renderOptions();
      } catch(e) {
        console.error(e);
      }
    }

    function updateDropdowns() {
      const catSelect = document.getElementById("itemCat");
      const condSelect = document.getElementById("itemCond");
      
      catSelect.innerHTML = '<option value="">Select Category</option>';
      categories.forEach(c => {
        catSelect.innerHTML += `<option value="${c}">${c.toUpperCase()}</option>`;
      });
      
      condSelect.innerHTML = '<option value="">Select Condition</option>';
      conditions.forEach(c => {
        condSelect.innerHTML += `<option value="${c}">${c.toUpperCase()}</option>`;
      });
    }

    function renderOptions() {
      const catDiv = document.getElementById("categoriesList");
      const condDiv = document.getElementById("conditionsList");
      
      catDiv.innerHTML = categories.map(c => `
        <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 8px; margin: 4px 0; border: 1px solid var(--border-color);">
          <span style="color: var(--light-text); font-size: 0.9rem;">${c}</span>
          <button type="button" onclick="deleteCategory('${c}')" class="btn-danger btn-small" style="padding: 3px 8px; font-size: 0.7rem;">Delete</button>
        </div>
      `).join("");
      
      condDiv.innerHTML = conditions.map(c => `
        <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 8px; margin: 4px 0; border: 1px solid var(--border-color);">
          <span style="color: var(--light-text); font-size: 0.9rem;">${c}</span>
          <button type="button" onclick="deleteCondition('${c}')" class="btn-danger btn-small" style="padding: 3px 8px; font-size: 0.7rem;">Delete</button>
        </div>
      `).join("");
    }

    async function addCategory() {
      const input = document.getElementById("newCategory");
      const cat = input.value.trim().toLowerCase();
      if (!cat || categories.includes(cat)) return;
      
      categories.push(cat);
      await saveOptions();
      input.value = "";
    }

    async function deleteCategory(cat) {
      categories = categories.filter(c => c !== cat);
      await saveOptions();
    }

    async function addCondition() {
      const input = document.getElementById("newCondition");
      const cond = input.value.trim().toLowerCase();
      if (!cond || conditions.includes(cond)) return;
      
      conditions.push(cond);
      await saveOptions();
      input.value = "";
    }

    async function deleteCondition(cond) {
      conditions = conditions.filter(c => c !== cond);
      await saveOptions();
    }

    async function saveOptions() {
      try {
        await db.collection("settings").doc("options").set({ categories, conditions });
        updateDropdowns();
        renderOptions();
      } catch(e) {
        alert("Error saving options: " + e.message);
      }
    }

    function doLogout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    function switchPage(page, btn) {
      document.querySelectorAll("main").forEach(m => m.classList.remove("active"));
      document.getElementById(page).classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (page === "inventory") loadInventory();
    }

    async function loadInventory() {
      try {
        const snap = await db.collection("items").get();
        const container = document.getElementById("inventoryList");
        container.innerHTML = "";

        if (snap.empty) {
          container.innerHTML = "<p style='color: var(--light-text);'>No items</p>";
          return;
        }

        snap.forEach(doc => {
          const item = doc.data();
          const vis = item.visible ? "✓" : "✗";
          container.innerHTML += `
            <div class="item-card">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <h3 style="font-size: 1rem;">${item.name}</h3>
                  <p style="font-size: 0.9rem; color: var(--light-text);"><strong>$${(item.price || 0).toFixed(2)}</strong></p>
                  <p style="font-size: 0.85rem; color: var(--light-text);">Category: ${item.category} | Condition: ${item.condition}</p>
                </div>
                <button class="btn-danger btn-small" onclick="deleteItem('${doc.id}')" style="font-size: 0.8rem;">Delete</button>
              </div>
            </div>
          `;
        });
      } catch(e) {
        console.error(e);
      }
    }

    async function addItem(e) {
      e.preventDefault();
      const msg = document.getElementById("addMsg");

      try {
        await db.collection("items").add({
          name: document.getElementById("itemName").value,
          category: document.getElementById("itemCat").value,
          price: parseFloat(document.getElementById("itemPrice").value),
          condition: document.getElementById("itemCond").value,
          visible: document.getElementById("itemVis").checked,
          createdAt: new Date().toISOString()
        });
        msg.innerHTML = "<p class='message success'>✓ Item added successfully!</p>";
        e.target.reset();
        loadInventory();
        setTimeout(() => msg.innerHTML = "", 3000);
      } catch(e) {
        msg.innerHTML = "<p class='message error'>✗ " + e.message + "</p>";
      }
    }

    async function deleteItem(id) {
      if (confirm("Delete this item?")) {
        try {
          await db.collection("items").doc(id).delete();
          loadInventory();
        } catch(e) {
          alert(e.message);
        }
      }
    }

    window.addEventListener("load", initFirebase);
  </script>
</body>
</html>
